<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PennyPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at top center, rgba(139, 92, 246, 0.12), transparent 45%), var(--bg-main);
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      margin-top: 1rem;
      font-size: 1.6rem;
    }
    .auth-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-box">
    <div class="auth-header">
      <a href="index.html" class="brand" style="justify-content: center;">
        <div class="brand-icon">
          <i data-lucide="compass" style="width: 22px; height: 22px;"></i>
        </div>
        <span>Penny<span class="accent">Pilot</span></span>
      </a>
      <h2>Create Student Account</h2>
      <p>Start tracking your campus finances smarter</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label class="form-label" for="regName">Full Name</label>
        <input 
          type="text" 
          id="regName" 
          class="form-control" 
          placeholder="e.g. Aryan Sharma" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input 
          type="email" 
          id="regEmail" 
          class="form-control" 
          placeholder="aryan@college.edu" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">
          Password
          <span class="hint">min 6 characters</span>
        </label>
        <input 
          type="password" 
          id="regPassword" 
          class="form-control" 
          placeholder="Create a strong password" 
          minlength="6"
          required 
          autocomplete="new-password"
        >
      </div>

      <button type="submit" id="regSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Get Started with PennyPilot
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Sign in</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmitBtn');

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        await registerUser(name, email, password);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Get Started with PennyPilot';
      }
    });
  </script>
</body>
</html>
