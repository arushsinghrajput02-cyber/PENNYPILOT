<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — PennyPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at top center, rgba(139, 92, 246, 0.12), transparent 45%), var(--bg-main);
    }
    .auth-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-header h2 {
      margin-top: 1rem;
      font-size: 1.6rem;
    }
    .auth-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-dim);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-subtle);
    }
    .divider:not(:empty)::before { margin-right: .85em; }
    .divider:not(:empty)::after { margin-left: .85em; }
  </style>
</head>
<body class="auth-page">

  <div class="auth-box">
    <div class="auth-header">
      <a href="index.html" class="brand" style="justify-content: center;">
        <div class="brand-icon">
          <i data-lucide="compass" style="width: 22px; height: 22px;"></i>
        </div>
        <span>Penny<span class="accent">Pilot</span></span>
      </a>
      <h2>Welcome Back</h2>
      <p>Log in to access your student financial dashboard</p>
    </div>

    <!-- Quick 1-Click Demo Login -->
    <button type="button" class="btn btn-outline" style="width: 100%; border-color: rgba(52, 211, 153, 0.4); color: var(--color-secondary); margin-bottom: 1rem;" onclick="demoLogin()">
      <i data-lucide="zap" style="width: 16px; height: 16px;"></i> One-Click Demo Student Login
    </button>

    <div class="divider">or sign in with email</div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="loginEmail">College Email</label>
        <input 
          type="email" 
          id="loginEmail" 
          class="form-control" 
          placeholder="student@college.edu" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <div class="form-label">
          <label for="loginPassword">Password</label>
          <a href="#" style="font-size: 0.8rem; color: var(--color-primary);" onclick="showToast('For local demo, use standard demo login or register a new user.', 'info')">Forgot?</a>
        </div>
        <div class="input-group">
          <input 
            type="password" 
            id="loginPassword" 
            class="form-control" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Sign In to PennyPilot
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
      Don't have an account? <a href="register.html" style="color: var(--color-primary); font-weight: 600;">Sign up free</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        await loginUser(email, password);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Sign In to PennyPilot';
      }
    });
  </script>
</body>
</html>
